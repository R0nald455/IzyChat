# Please consult our docs for more info: https://www.librechat.ai/docs/configuration/docker_override

# TO USE THIS FILE, FIRST UNCOMMENT THE LINE ('services:')

# THEN UNCOMMENT ONLY THE SECTION OR SECTIONS CONTAINING THE CHANGES YOU WANT TO APPLY
# SAVE THIS FILE AS 'docker-compose.override.yaml'
# AND USE THE 'docker compose build' & 'docker compose up -d' COMMANDS AS YOU WOULD NORMALLY DO

# WARNING: YOU CAN ONLY SPECIFY EVERY SERVICE NAME ONCE (api, mongodb, meilisearch, ...)
# IF YOU WANT TO OVERRIDE MULTIPLE SETTINGS IN ONE SERVICE YOU WILL HAVE TO EDIT ACCORDINGLY

# EXAMPLE: if you want to use the config file and the latest numbered release docker image the result will be:

services:

  api:
    image: librechat
    build:
      context: .
      target: node
    extra_hosts:
        - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb
      - rag_api
      - docker-socket-proxy
    environment:
      # Docker-outside-of-Docker, but through docker-socket-proxy below
      # instead of the raw socket: `api` never gets root-equivalent access
      # to the host daemon, only the handful of API calls `docker run`
      # needs to launch/stop the ephemeral `playwright` MCP container.
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    volumes:
    - C:\Users\RonaldDavidCharariPa\Documents\izyMCP\izytesting-mcp:/app/izytesting-mcp:ro
    - type: bind
      source: ./librechat.yaml
      target: /app/librechat.yaml

  # Least-privilege gateway to the host's Docker daemon: `api` talks to this
  # instead of mounting /var/run/docker.sock directly. Only the Docker API
  # surface needed to create/start/stop/remove containers and pull images is
  # allowed (CONTAINERS, IMAGES, POST) — exec into containers, volumes,
  # networks, swarm, secrets, and everything else stays blocked (default 0).
  # https://github.com/Tecnativa/docker-socket-proxy
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0
      SERVICES: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      PLUGINS: 0
      NODES: 0
      SECRETS: 0
      CONFIGS: 0
      BUILD: 0
      COMMIT: 0
      DISTRIBUTION: 0
      AUTH: 0
      SESSION: 0
      EVENTS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

# NOTE: the previous `playwright-mcp` (streamable-http server) and
# `mcp-guard` (session-recovery proxy) services were removed when the
# `playwright` MCP server in librechat.yaml switched to stdio, spawning
# a fresh container per session via the Docker socket above. `chrome-devtools`
# follows the same per-session pattern (see librechat.yaml) — no dedicated
# browser container needed here either.

